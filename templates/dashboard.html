<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Analysis Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1419; color: #fff; }
        
        nav { background: #1a1f2e; padding: 1rem 2rem; border-bottom: 2px solid #0066cc; }
        nav h1 { margin: 0; color: #0066cc; }
        nav ul { list-style: none; display: flex; gap: 2rem; margin-top: 1rem; }
        nav a { color: #fff; text-decoration: none; transition: color 0.3s; }
        nav a:hover { color: #0066cc; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: #1a1f2e; padding: 1.5rem; border-left: 4px solid #0066cc; border-radius: 4px; }
        .stat-card h3 { color: #888; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-card .number { font-size: 2.5rem; font-weight: bold; color: #0066cc; }
        
        .chart-container { background: #1a1f2e; padding: 2rem; border-radius: 4px; margin-bottom: 2rem; }
        .chart-container h2 { margin-bottom: 1.5rem; font-size: 1.3rem; }
        
        table { width: 100%; border-collapse: collapse; background: #1a1f2e; }
        table th { background: #0f1419; padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc; font-weight: 600; }
        table td { padding: 1rem; border-bottom: 1px solid #2a2f3e; }
        table tr:hover { background: #252a39; }
        
        .badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 3px; font-size: 0.8rem; font-weight: 600; }
        .badge-critical { background: #c41e3a; }
        .badge-high { background: #ff6b6b; }
        .badge-medium { background: #ffa500; }
        .badge-low { background: #4CAF50; }
        .badge-new { background: #0066cc; }
        .badge-acknowledged { background: #666; }
        
        .btn { padding: 0.7rem 1.5rem; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #0052a3; }
        
        .loading { text-align: center; padding: 2rem; color: #888; }
    </style>
</head>
<body>
    <nav>
        <h1>🛡️ SOC Analysis Platform</h1>
        <ul>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/alerts">Alerts</a></li>
            <li><a href="/events">Events</a></li>
            <li><a href="/rules">Rules</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 style="margin-bottom: 2rem;">Security Operations Center Dashboard</h2>
        
        <div class="stats-grid" id="statsContainer">
            <div class="loading">Loading statistics...</div>
        </div>

        <div class="chart-container">
            <h2>Recent Alerts</h2>
            <table id="alertsTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="alertsBody">
                    <tr><td colspan="4" class="loading">Loading alerts...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="chart-container">
            <h2>Severity Distribution</h2>
            <div id="severityChart" style="min-height: 200px; display: flex; align-items: flex-end; gap: 1rem;">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                const html = `
                    <div class="stat-card">
                        <h3>Total Events</h3>
                        <div class="number">${data.total_events}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total Alerts</h3>
                        <div class="number">${data.total_alerts}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Critical</h3>
                        <div class="number">${data.severity_distribution['CRITICAL'] || 0}</div>
                    </div>
                    <div class="stat-card">
                        <h3>High</h3>
                        <div class="number">${data.severity_distribution['HIGH'] || 0}</div>
                    </div>
                `;
                
                document.getElementById('statsContainer').innerHTML = html;
            } catch (e) {
                console.error('Error loading stats:', e);
            }
        }

        async function loadAlerts() {
            try {
                const response = await fetch('/api/alerts?per_page=5');
                const data = await response.json();
                
                const tbody = document.getElementById('alertsBody');
                tbody.innerHTML = data.alerts.map(alert => `
                    <tr>
                        <td>${alert.title}</td>
                        <td><span class="badge badge-${alert.severity.toLowerCase()}">${alert.severity}</span></td>
                        <td><span class="badge badge-${alert.status.toLowerCase()}">${alert.status}</span></td>
                        <td>${new Date(alert.created_at).toLocaleString()}</td>
                    </tr>
                `).join('') || '<tr><td colspan="4">No alerts</td></tr>';
            } catch (e) {
                console.error('Error loading alerts:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadAlerts();
            setInterval(loadStats, 30000);
            setInterval(loadAlerts, 30000);
        });
    </script>
</body>
</html>
