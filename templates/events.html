<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - SOC Analysis</title>
</head>
<body style="background: #0f1419; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0;">
    <nav style="background: #1a1f2e; padding: 1rem 2rem; border-bottom: 2px solid #0066cc;">
        <h1 style="margin: 0; color: #0066cc;">🛡️ SOC Analysis Platform</h1>
        <ul style="list-style: none; display: flex; gap: 2rem; margin-top: 1rem;">
            <li><a href="/dashboard" style="color: #fff; text-decoration: none;">Dashboard</a></li>
            <li><a href="/alerts" style="color: #fff; text-decoration: none;">Alerts</a></li>
            <li><a href="/events" style="color: #0066cc; text-decoration: none; font-weight: bold;">Events</a></li>
            <li><a href="/rules" style="color: #fff; text-decoration: none;">Rules</a></li>
        </ul>
    </nav>

    <div style="max-width: 1400px; margin: 0 auto; padding: 2rem;">
        <h2 style="margin-bottom: 2rem;">Windows Events</h2>

        <table style="width: 100%; border-collapse: collapse; background: #1a1f2e;">
            <thead>
                <tr style="background: #0f1419;">
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Event ID</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Computer</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">User</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Type</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Timestamp</th>
                </tr>
            </thead>
            <tbody id="eventsBody">
                <tr><td colspan="5" style="padding: 1rem; text-align: center; color: #888;">Loading events...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadEvents() {
            try {
                const response = await fetch('/api/events?per_page=50');
                const data = await response.json();
                
                const tbody = document.getElementById('eventsBody');
                tbody.innerHTML = data.events.map(event => `
                    <tr style="border-bottom: 1px solid #2a2f3e;">
                        <td style="padding: 1rem;">${event.event_id}</td>
                        <td style="padding: 1rem;">${event.computer_name}</td>
                        <td style="padding: 1rem;">${event.user || '-'}</td>
                        <td style="padding: 1rem;">${event.event_type}</td>
                        <td style="padding: 1rem;">${new Date(event.timestamp).toLocaleString()}</td>
                    </tr>
                `).join('') || '<tr><td colspan="5" style="padding: 1rem; text-align: center;">No events found</td></tr>';
            } catch (e) {
                console.error('Error:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadEvents);
    </script>
</body>
</html>
