<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - SOC Analysis</title>
</head>
<body style="background: #0f1419; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0;">
    <nav style="background: #1a1f2e; padding: 1rem 2rem; border-bottom: 2px solid #0066cc;">
        <h1 style="margin: 0; color: #0066cc;">🛡️ SOC Analysis Platform</h1>
        <ul style="list-style: none; display: flex; gap: 2rem; margin-top: 1rem;">
            <li><a href="/dashboard" style="color: #fff; text-decoration: none;">Dashboard</a></li>
            <li><a href="/alerts" style="color: #0066cc; text-decoration: none; font-weight: bold;">Alerts</a></li>
            <li><a href="/events" style="color: #fff; text-decoration: none;">Events</a></li>
            <li><a href="/rules" style="color: #fff; text-decoration: none;">Rules</a></li>
        </ul>
    </nav>

    <div style="max-width: 1400px; margin: 0 auto; padding: 2rem;">
        <h2 style="margin-bottom: 2rem;">Security Alerts</h2>
        
        <div style="margin-bottom: 1rem;">
            <label>Filter by Status: 
                <select id="statusFilter" style="padding: 0.5rem; background: #1a1f2e; color: #fff; border: 1px solid #0066cc;">
                    <option value="">All</option>
                    <option value="NEW">New</option>
                    <option value="ACKNOWLEDGED">Acknowledged</option>
                    <option value="RESOLVED">Resolved</option>
                </select>
            </label>
            <label style="margin-left: 1rem;">Filter by Severity:
                <select id="severityFilter" style="padding: 0.5rem; background: #1a1f2e; color: #fff; border: 1px solid #0066cc;">
                    <option value="">All</option>
                    <option value="CRITICAL">Critical</option>
                    <option value="HIGH">High</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="LOW">Low</option>
                </select>
            </label>
        </div>

        <table style="width: 100%; border-collapse: collapse; background: #1a1f2e;">
            <thead>
                <tr style="background: #0f1419;">
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Title</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Severity</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Status</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Assigned</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Created</th>
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #0066cc;">Actions</th>
                </tr>
            </thead>
            <tbody id="alertsBody">
                <tr><td colspan="6" style="padding: 1rem; text-align: center; color: #888;">Loading alerts...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadAlerts() {
            const status = document.getElementById('statusFilter').value;
            const severity = document.getElementById('severityFilter').value;
            
            let url = '/api/alerts?per_page=50';
            if (status) url += `&status=${status}`;
            if (severity) url += `&severity=${severity}`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            const tbody = document.getElementById('alertsBody');
            tbody.innerHTML = data.alerts.map(alert => `
                <tr style="border-bottom: 1px solid #2a2f3e;">
                    <td style="padding: 1rem;">${alert.title}</td>
                    <td style="padding: 1rem;"><span style="background: ${alert.severity === 'CRITICAL' ? '#c41e3a' : '#ff6b6b'}; padding: 0.3rem 0.8rem; border-radius: 3px; font-size: 0.8rem;">${alert.severity}</span></td>
                    <td style="padding: 1rem;"><span style="background: #0066cc; padding: 0.3rem 0.8rem; border-radius: 3px; font-size: 0.8rem;">${alert.status}</span></td>
                    <td style="padding: 1rem;">${alert.assigned_to || '-'}</td>
                    <td style="padding: 1rem;">${new Date(alert.created_at).toLocaleString()}</td>
                    <td style="padding: 1rem;"><button onclick="viewAlert(${alert.id})" style="background: #0066cc; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 3px; cursor: pointer;">View</button></td>
                </tr>
            `).join('') || '<tr><td colspan="6" style="padding: 1rem; text-align: center;">No alerts found</td></tr>';
        }

        function viewAlert(id) {
            alert(`Alert ${id} clicked - implement details view`);
        }

        document.getElementById('statusFilter').addEventListener('change', loadAlerts);
        document.getElementById('severityFilter').addEventListener('change', loadAlerts);
        
        document.addEventListener('DOMContentLoaded', loadAlerts);
    </script>
</body>
</html>
